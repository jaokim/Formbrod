name: AmigaOS 4 build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  amigaos4:
    runs-on: ubuntu-latest
    container:
      image: walkero/amigagccondocker:os4-gcc11
    steps:
      - uses: actions/checkout@v4

      # tools/fetch-deps.sh needs lha or lhasa for .lha archives.
      - name: Install unpack tools
        run: |
          if ! command -v lha >/dev/null && ! command -v lhasa >/dev/null; then
            SUDO=; [ "$(id -u)" = 0 ] || SUDO=sudo
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq lhasa curl
          fi

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: deps/cache
          key: deps-${{ hashFiles('tools/deps.list') }}

      - name: Dependencies
        run: tools/fetch-deps.sh

      # CC is passed explicitly: make's built-in default (cc) means
      # "CC ?= ppc-amigaos-gcc" in the Makefile never takes effect.
      # First a build without ffmpeg, so that path keeps compiling.
      - name: Build without ffmpeg
        run: make CC=ppc-amigaos-gcc LIBAV=0 BUILD=build/amiga-noav TARGET=Formbrod-noav

      # LIBAV turns on by itself now that deps/ffmpeg exists.
      - name: Build
        run: |
          make config
          make CC=ppc-amigaos-gcc
          test "$(make -s config)" = "LIBAV=1 LIBAV_PREFIX=deps/ffmpeg"

      # The .cd/.ct files are UTF-8; the Makefile converts them to
      # ISO-8859-1 with iconv before handing them to FlexCat.
      - name: Catalogs (FlexCat)
        run: |
          make catalogs
          ls -lR Catalogs

      # Cross-check FlexCat's catalogs against tools/catgen.py, which also
      # generates src/locale/strings.h. Fails if the strings differ.
      - name: Compare with catgen
        run: |
          if command -v python3 >/dev/null; then
            make compare-catalogs
          else
            echo "::warning::python3 is not in the image; FlexCat catalogs were not cross-checked"
          fi

      - name: Dump catalogs on failure
        if: failure()
        run: |
          for f in Catalogs/*/formbrod.catalog build/locale/catgen/*/formbrod.catalog; do
            [ -f "$f" ] || continue
            echo "== $f"
            od -A d -t x1z "$f" | head -40
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Formbrod-os4
          path: |
            Formbrod
            Catalogs/
